name: Build UEFI - Galaxy Tab A7 (gta4l / SM6115 Bengal)

on:
  push:
    branches: [gta4l, master]
    paths:
      - 'Platform/Samsung/sm6225/**'
      - 'configs/devices/gta4l.conf'
      - '.github/workflows/build-gta4l.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        default: 'DEBUG'
        type: choice
        options: [DEBUG, RELEASE]

jobs:
  build:
    name: Build gta4l UEFI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo dpkg --add-architecture i386
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key \
            https://dl.winehq.org/wine-builds/winehq.key
          sudo chmod 644 /etc/apt/keyrings/winehq-archive.key
          sudo wget -O /etc/apt/sources.list.d/winehq-noble.sources \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install --install-recommends winehq-stable libsdl2-2.0-0 libsdl2-dev \
            build-essential uuid-dev clang llvm iasl nasm gcc-aarch64-linux-gnu abootimg \
            python3-pil python3-git gettext libgcc-s1:i386 libstdc++6:i386 -y

      # DEBUG WITHOUT --uart: SerialPortLib = FrameBufferSerialPortLib, so the
      # entire UEFI boot log renders ON THE TABLET SCREEN (no EUD/serial needed).
      - name: Build gta4l (DEBUG, on-screen console, installer zip)
        run: |
          ./build.sh --device gta4l \
            --release ${{ github.event.inputs.mode || 'DEBUG' }} \
            --installer-zip

      # PROVEN by the modified-recovery-kernel test: the Samsung Bengal ABL
      # cryptographically verifies the boot image and refuses to launch it if
      # the content does not match a valid AVB (Android Verified Boot) footer -
      # changing 16 bytes of a genuine recovery kernel got it rejected. The
      # vbmeta partition's VERIFICATION_DISABLED flag only covers the
      # system/vendor chain; boot/recovery carry their own self-vbmeta footer
      # which the bootloader checks for integrity (the signature key is not
      # enforced while unlocked, so an unsigned hash footer is accepted).
      #
      # Add an unsigned hash footer with the official AOSP avbtool, then force
      # the image to the full 96 MiB partition size with the 64-byte AVBf
      # footer in the very last bytes (where the ABL reads it), matching the
      # stock recovery layout. We dd-flash full-size so the footer lands at
      # partition_end-64.
      - name: Add AVB hash footer (boot partition = 96 MiB)
        run: |
          curl -s "https://android.googlesource.com/platform/external/avb/+/refs/heads/master/avbtool.py?format=TEXT" \
            | base64 -d > avbtool
          chmod +x avbtool
          python3 avbtool version
          PSIZE=100663296
          img=boot-gta4l.img
          python3 avbtool add_hash_footer \
            --image "$img" \
            --partition_name boot \
            --partition_size "$PSIZE"
          echo "avbtool output size: $(stat -c%s "$img")"
          python3 avbtool info_image --image "$img" | head -40
          # Re-lay out to a full partition_size image: keep the vbmeta where
          # avbtool put it, zero-pad, and place the AVBf footer in the last 64B.
          python3 - "$img" "$PSIZE" <<'PY'
          import sys
          path, P = sys.argv[1], int(sys.argv[2])
          d = open(path,'rb').read()
          assert d[-64:].startswith(b'AVBf'), "no AVBf footer at end of avbtool output"
          footer = d[-64:]
          body = d[:-64]
          assert len(body) <= P-64, f"image too big for partition: {len(body)} > {P-64}"
          out = body + b'\x00'*(P-64-len(body)) + footer
          open(path,'wb').write(out)
          print(f"final full-partition image: {len(out)} bytes, AVBf at {len(out)-64:#x}")
          PY

      - name: Upload UEFI image + installer
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-uefi
          path: |
            ./*.img
            ./uefi-installer-*.zip
