SOC_PLATFORM="SM6225"
VENDOR_NAME="Samsung"
PLATFORM_NAME="gta4l"

# mkbootimg config
# SM-T500 stock boot.img is header v2, but edk2-msm uses the Qualcomm
# "appended DTB" method (DTB is concatenated onto the kernel image in
# platform_build_kernel), so we pack as header v1 like the sibling
# sm6225 devices (spes/fog). v2 would need a separate --dtb section.
# Debug UART (from stock cmdline): msm_geni_serial @ 0x4a90000, ttyMSM0 115200n8
BOOTIMG_OS_PATCH_LEVEL="2026-05"
BOOTIMG_OS_VERSION=16.0.0
BOOTIMG_HEADER_VERSION=1

# Run the UEFI FD in the LOW-memory sandbox (like the stock uefiplat.cfg,
# which places "UEFI FD" at 0x5FC00000) instead of the Khaje default
# 0xCE000000. The Samsung Bengal ABL hands off to a Linux kernel loaded in
# low memory and may not map high DRAM when PrePi enables the MMU, faulting
# silently if UEFI runs at 0xCE000000. 0x58000000 is a 7 MB hole in the low
# sandbox (below Display Reserved @ 0x5C000000). Overrides configs/sm6225.conf.
FD_BASE=0x58000000
FD_SIZE=0x00700000
