SOC_PLATFORM="SM6225"
VENDOR_NAME="Samsung"
PLATFORM_NAME="gta4l"

# mkbootimg config
# SM-T500 stock boot.img is header v2, but edk2-msm uses the Qualcomm
# "appended DTB" method (DTB is concatenated onto the kernel image in
# platform_build_kernel), so we pack as header v1 like the sibling
# sm6225 devices (spes/fog). v2 would need a separate --dtb section.
# Debug UART (from stock cmdline): msm_geni_serial @ 0x4a90000, ttyMSM0 115200n8
BOOTIMG_OS_PATCH_LEVEL="2026-05"
BOOTIMG_OS_VERSION=16.0.0
BOOTIMG_HEADER_VERSION=1
